[project]
name = "mausoleo"
version = "0.1.0"
description = "OCR autoresearch for the Il Messaggero historical newspaper corpus (1880-1959)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ms-swift>=4.4.2",
    "transformers==5.5.4",
]

[project.optional-dependencies]
ocr = [
    "Pillow>=10.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.25.0",
    "torch>=2.0.0",
]
ocr-vllm = [
    "vllm>=0.4.0",
]
eval = [
    "jiwer>=3.0.0",
]
scrape = [
    "playwright>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyright>=1.1.0",
    "ruff>=0.3.0",
    "ty>=0.0.1a1",
    "jiwer>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mausoleo"]

[tool.ruff]
line-length = 144
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E702", "E731", "UP008", "E712"]
extend-select = ["UP"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
exclude = ["**/__pycache__", ".venv"]
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
